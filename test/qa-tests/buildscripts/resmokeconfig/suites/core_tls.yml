selector:
  js_test:
    roots:
      - jstests/dump/*.js
      - jstests/files/*.js
      - jstests/import/*.js
      - jstests/restore/*.js

executor:
  js_test:
    config:
      shell_options:
        eval_prepend:
          "load('jstests/libs/run_mongod.js'); load('jstests/libs/assert_authenticate.js');"
        global_vars:
          TestData:
            useTLS: true

            # SERVER-91804 changed the mongo shell to expect termination
            # of all subprocesses by default. We add the following to
            # preserve the old behavior (i.e., of not caring).
            ignoreUnterminatedProcesses: true
        tls: ""
        tlsAllowInvalidCertificates: ""
        tlsCAFile: jstests/libs/ca.pem
        tlsCertificateKeyFile: jstests/libs/client.pem
    hooks:
      - class: CleanEveryN
        n: 20
    fixture:
      class: MongoDFixture
      mongod_options:
        set_parameters:
          enableTestCommands: 1
        tlsMode: allowTLS
        tlsCertificateKeyFile: jstests/libs/server.pem
        tlsCAFile: jstests/libs/ca.pem
        tlsAllowConnectionsWithoutCertificates: ""
