# We use the github backend for nearly everything we can for two reasons. One is consistency: this
# way all developers compile Go packages with the same versions. The other is speed: downloading
# pre-built binaries from GitHub is faster than compiling from source. In many cases these tools
# are available in the mise registry with multiple backends, so spelling out "github:..." ensures
# we use the github backend.

[tools]
# Go and Go tools
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "0.24.0"
"github:golangci/golangci-lint" = "2.15.0"
"github:securego/gosec" = "2.30.0"
"github:houseabsolute/omegasort" = "0.2.1"
"github:houseabsolute/precious" = "1.0.0"
"github:crate-ci/typos" = "1.51.1"
"github:koalaman/shellcheck" = "0.11.0"
"github:mvdan/sh" = { version = "3.14.1", bin = "shfmt" }

# Node and npm tools
# node is here because the npm: tools below need a Node runtime to execute.
node = "22.23.4"
"npm:eslint" = "8.57.0"
"npm:github-codeowners" = "0.2.1"
# This opts out of the minimum_release_age below because this is a MongoDB project and we often need
# to update to new versions.
"npm:@mongodb-js/mongodb-runner" = { version = "8.4.3", minimum_release_age = "0d" }
"npm:oxfmt" = "0.74.0"

[settings]
# This prevents us from upgrading to anything that was released less than 7 days ago. It gives us a
# bit of protection against supply-chain attacks.
minimum_release_age = "7d"

[settings.node]
# We turn off GPG verification for node because it has been flaky in CI, and also requires a local
# GPG public key.
gpg_verify = false

[settings.npm]
# mise's default installer for npm: tools is its embedded "aube", which lays each package out as a
# nested symlink virtual store (node_modules/.mise/...). Evergreen's cache.save cannot archive that
# on Windows (where the store is junctions) and balloons it to gigabytes when it dereferences the
# links elsewhere. Pin the installer to npm's plain bin/ + lib/node_modules layout instead.
package_manager = "npm"
