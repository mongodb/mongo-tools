# We use the github backend for nearly everything we can for two reasons. One is consistency: this
# way all developers compile Go packages with the same versions. The other is speed: downloading
# pre-built binaries from GitHub is faster than compiling from source. In many cases these tools
# are available in the mise registry with multiple backends, so spelling out "github:..." ensures
# we use the github backend.

[tools]
# Go and Go tools
go = "1.26.7"
"go:golang.org/x/tools/gopls" = "0.23.0"
"github:golangci/golangci-lint" = "2.12.2"
"github:securego/gosec" = "2.27.1"
"github:houseabsolute/omegasort" = "0.1.3"
"github:houseabsolute/precious" = "0.10.2"
"github:crate-ci/typos" = "1.46.1"
"github:koalaman/shellcheck" = "0.11.0"
"github:mvdan/sh" = { version = "3.13.1", bin = "shfmt" }

# Node and npm tools
# node is here because the npm: tools below need a Node runtime to execute.
node = "22.22.0"
"npm:eslint" = "8.57.0"
"npm:github-codeowners" = "0.2.1"
# This opts out of the minimum_release_age below because this release is ours and is cut as it is
# needed.
"npm:@mongodb-js/mongodb-runner" = { version = "6.12.0", minimum_release_age = "0d" }
"npm:oxfmt" = "0.52.0"

[settings]
# This prevents us from upgrading to anything that was released less than 7 days ago. It gives us a
# bit of protection against supply-chain attacks.
minimum_release_age = "7d"

[settings.node]
# We turn off GPG verification for node because it has been flaky in CI, and also requires a local
# GPG public key.
gpg_verify = false
